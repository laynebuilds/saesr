[project]
name = "saesr-backend"
version = "0.1.0"
description = "Saesr API: computer vision threat detection for warehouses"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
live = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
