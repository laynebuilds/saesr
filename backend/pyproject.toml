[project]
name = "saesr-backend"
version = "0.1.0"
description = "Saesr API: computer vision threat detection for warehouses"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
live = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "lap>=0.5",
    # Newer torch wheels need macOS 14; these are the latest that install on macOS 13 (tested).
    "torch>=2.4,<=2.11.0",
    "torchvision<=0.26.0",
]

# Durable actors bridge (app/actors.py), used only when ACTORS_URL is set. Needs Python 3.11+.
actors = ["durable-actors==0.14.6; python_version >= '3.11'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
